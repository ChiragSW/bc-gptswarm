experiment:
  name: phase3_ollama_smoke
  methods: [direct, full, random, optimized]
  seeds: [7]
dataset:
  dev_path: data/mmlu/dev_subset.jsonl
  validation_path: data/mmlu/validation_subset.jsonl
  eval_limit: 5
  optimization_limit: 5
model:
  provider: ollama
  model: qwen2.5:0.5b
  base_url: http://127.0.0.1:11434
  temperature: 0.0
  max_tokens: 4
  seed: 20260918
  timeout_seconds: 120
  cache_enabled: false
  cache_path: data/cache/ollama_smoke.sqlite3
graph:
  num_truthful_agents: 1
  num_adversarial_agents: 1
  initial_probability: 0.5
  threshold: 0.5
optimization:
  iterations: 2
  batch_size: 2
  learning_rate: 0.1
output:
  raw_dir: results/raw
  baseline_csv: results/ollama_smoke_results.csv
  experiment_log: experiments/experiment_log.csv
