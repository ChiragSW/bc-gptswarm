[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bc-gptswarm"
version = "0.1.0"
description = "Reproducible GPTSwarm baseline and budget-constrained research extension"
requires-python = ">=3.10,<3.11"
dependencies = [
  "datasets==4.0.0",
  "matplotlib==3.10.6",
  "networkx==3.4.2",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "PyYAML==6.0.2",
  "requests==2.32.5",
  "torch==2.8.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
